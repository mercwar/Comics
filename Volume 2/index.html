<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERCWAR COMICS — VOLUME 2 READER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <button id="toggleDrawerBtn" class="btn" title="Toggle Page Index">☰ Index</button>
      <span class="brand-badge">VOL. 2</span>
      <div class="brand-title">
        <h1>MERCWAR COMICS — VOLUME 2</h1>
        <p id="issueSubtitle">AVIS Protocol • Loading Issue...</p>
      </div>
    </div>

    <div class="controls-bar">
      <select id="issueSelector" aria-label="Select Volume 2 Issue">
        <option value="1">Issue #01 — Beyond the Stargate Rift</option>
        <option value="2">Issue #02 — The Prime Forge</option>
        <option value="3">Issue #03 — The Dark Armada</option>
        <option value="4">Issue #04 — The Eclipse Protocol</option>
        <option value="5">Issue #05 — Sector Zero</option>
      </select>

      <button id="firstBtn" class="btn" title="First Page">⏮</button>
      <button id="prevBtn" class="btn" title="Previous Page">◀ Prev</button>
      <span class="page-counter" id="pageIndicator">0 / 0</span>
      <button id="nextBtn" class="btn btn-primary" title="Next Page">Next ▶</button>
      <button id="lastBtn" class="btn" title="Last Page">⏭</button>

      <button id="zoomOutBtn" class="btn" title="Zoom Out">−</button>
      <button id="fitBtn" class="btn" title="Reset Fit">Fit</button>
      <button id="zoomInBtn" class="btn" title="Zoom In">+</button>
    </div>
  </header>

  <div class="reader-shell">
    <aside class="drawer" id="indexDrawer">
      <div class="drawer-header">
        <h2>🗂️ Page Index</h2>
        <button id="closeDrawerBtn" class="btn btn-sm">✕</button>
      </div>
      <ul class="page-list" id="pageList"></ul>
      <div class="drawer-footer">
        <div><strong>SOURCE:</strong> /issue #/.json &amp; .images</div>
        <div><strong>CREATOR:</strong> MERCWAR (CVBGOD)</div>
      </div>
    </aside>

    <main class="stage">
      <div class="status-banner" id="statusBanner" hidden></div>

      <div class="comic-frame" id="comicFrame">
        <img id="comicImage" src="" alt="Mercwar Volume 2 Comic Page" />
      </div>

      <div class="bottom-nav">
        <button id="bottomPrevBtn" class="btn">◀ Previous Page</button>
        <button id="bottomNextBtn" class="btn btn-primary">Next Page ▶</button>
      </div>
    </main>
  </div>

  <footer class="footer">
    <span>MERCWAR AI SYSTEMS • AVIS PROTOCOL</span> |
    <a href="../index.html">Main Repo Browser</a> |
    <a href="https://github.com/mercwar/Comics" target="_blank" rel="noopener">GitHub Repository</a> |
    <a href="https://github.com/mercwar" target="_blank" rel="noopener">Mercwar Portal</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
