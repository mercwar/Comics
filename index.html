<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERCWAR COMICS — COMIC READER</title>
  <link rel="stylesheet" href="style.css?v=5" />
  <link rel="stylesheet" href="style1.css?v=5" />
</head>
<body>

  <!-- Top Navigation & Controls Bar -->
  <header class="topbar">
    <div class="brand-group">
      <button id="toggleSidebarBtn" class="btn" title="Toggle Page Thumbnails" aria-label="Toggle Page Thumbnails">☰ Pages</button>
      <div class="brand-title">
        <h1>MERCWAR COMICS</h1>
        <p id="issueSubtitle">Scanning Repository Folders...</p>
      </div>
    </div>

    <div class="controls-bar">
      <!-- Dynamically Populated Volume Selector -->
      <select id="volumeSelector" aria-label="Select Comic Volume">
        <option value="" disabled selected>Loading Volumes...</option>
      </select>

      <!-- Dynamically Populated Issue Selector -->
      <select id="issueSelector" aria-label="Select Comic Issue">
        <option value="" disabled selected>Loading Issues...</option>
      </select>

      <div class="control-group">
        <button id="firstBtn" class="btn" title="First Page" aria-label="First Page">⏮</button>
        <button id="prevBtn" class="btn" title="Previous Page" aria-label="Previous Page">◀ Prev</button>
        <span class="page-counter" id="pageIndicator">0 / 0</span>
        <button id="nextBtn" class="btn btn-primary" title="Next Page" aria-label="Next Page">Next ▶</button>
        <button id="lastBtn" class="btn" title="Last Page" aria-label="Last Page">⏭</button>
      </div>

      <div class="control-group">
        <button id="fitWidthBtn" class="btn active" title="Fit to Width">Width</button>
        <button id="fitHeightBtn" class="btn" title="Fit to Screen Height">Fit</button>
        <button id="zoomOutBtn" class="btn" title="Zoom Out" aria-label="Zoom Out">−</button>
        <span class="zoom-readout" id="zoomReadout">100%</span>
        <button id="zoomInBtn" class="btn" title="Zoom In" aria-label="Zoom In">+</button>
      </div>
    </div>
  </header>

  <!-- Main Reader Workspace -->
  <div class="reader-shell" id="readerShell">
    
    <!-- Thumbnail Drawer -->
    <aside class="sidebar" id="thumbnailSidebar">
      <!-- Mercwar Links Dropdown -->
      <div class="sidebar-links-bar">
        <button class="links-dropdown-btn" id="mercwarLinksBtn" type="button" aria-expanded="false" aria-controls="mercwarLinksMenu">
          <span>🔗 MERCWAR LINKS</span>
          <span class="dropdown-arrow">▼</span>
        </button>
        <ul class="links-dropdown-menu" id="mercwarLinksMenu" hidden>
          <li><a href="https://github.com/mercwar" target="_blank" rel="noopener noreferrer">🌐 Mercwar Github</a></li>
          <li><a href="https://github.com/mercwar/Comics" target="_blank" rel="noopener noreferrer">📚 Mercwar Comics</a></li>
          <li><a href="https://cron.iblogger.org/Station" target="_blank" rel="noopener noreferrer">🛒 Cyborg Station</a></li>
          <li><a href="https://cron.iblogger.org/NEXUS" target="_blank" rel="noopener noreferrer">📜 NEXUS</a></li>
          <li><a href="https://mercwar01.byet3host.com" target="_blank" rel="noopener noreferrer">💬 Mercwar AI</a></li>
        </ul>
      </div>

      <div class="sidebar-header">
        <h2>🗂️ Page Index</h2>
        <span class="thumb-count" id="thumbCount">0 PAGES</span>
      </div>

      <div class="thumbnail-grid" id="thumbnailGrid"></div>

      <div class="sidebar-footer">
        <div><strong>SOURCE:</strong> Dynamic GitHub Scan</div>
        <div><strong>HOTKEYS:</strong> ← → Navigate • + − Zoom</div>
      </div>
    </aside>

    <!-- Comic Stage -->
    <main class="stage" id="stage">
      
      <!-- Error / Status Toast -->
      <div class="status-toast" id="statusToast" hidden></div>

      <!-- Comic Page Viewport -->
      <div class="comic-viewport" id="comicViewport" hidden>
        <img id="comicImage" alt="Comic Page" />

        <!-- Invisible Left/Right Click Zones for Easy Reading -->
        <div class="click-zone click-prev" id="clickPrevZone" title="Previous Page" aria-hidden="true"></div>
        <div class="click-zone click-next" id="clickNextZone" title="Next Page" aria-hidden="true"></div>
      </div>

      <!-- Bottom Caption Bar -->
      <div class="caption-bar">
        <span id="pageCaptionReadout">LOADING...</span>
      </div>
    </main>

  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
